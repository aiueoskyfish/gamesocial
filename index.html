<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>twitalkV2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body class="login-body">

<main class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <i data-ico="logo" class="login-logo-mark"></i>
      <h1 class="login-logo-text">GameSocial</h1>
    </div>

    <p class="login-tagline">知らない誰かと、<br>いますぐ<em>つながる</em>。</p>

    <ul class="login-features">
      <li>
        <i data-ico="keyboard"></i>
        <div><strong>チャット</strong>打っている文字がそのまま流れる</div>
      </li>
      <li>
        <i data-ico="mic"></i>
        <div><strong>通話</strong>サーバーを経由しない直接通話</div>
      </li>
      <li>
        <i data-ico="link"></i>
        <div><strong>ランダム</strong>性別とゲームで絞り込める</div>
      </li>
    </ul>

    <button id="loginBtn" class="btn-twitter" type="button">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path fill="currentColor" d="M18.9 1.2h3.7l-8 9.1 9.4 12.4h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.8L0 1.2h7.6l5.4 7.1zm-1.3 19.3h2L5.9 3.3H3.7z"/>
      </svg>
      <span>Xでログイン</span>
    </button>

    <p id="loginNote" class="login-note">
      名前・アイコン・フォロワー数のみ取得します。<br>
      ツイートの投稿・閲覧は行いません。
    </p>

    <div id="loginBusy" class="login-busy hidden">
      <div class="spinner"></div>
      <span id="loginBusyText">認証中...</span>
    </div>

  </div>

  <footer class="login-footer">P2P · 中央サーバーにデータを置きません</footer>
</main>

<div id="toastHost" class="toast-host" aria-live="polite"></div>

<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  const btn  = document.getElementById('loginBtn');
  const busy = document.getElementById('loginBusy');
  const note = document.getElementById('loginNote');

  if (Auth.isLoggedIn()) {
    location.replace('app.html');
    return;
  }

  if (!Auth.isConfigured()) {
    btn.disabled = true;
    note.innerHTML =
      'セットアップが未完了です。<br>' +
      '<code>js/auth.js</code> の <code>clientId</code> と <code>workerUrl</code> を設定してください。<br>' +
      '手順は <code>worker/README.md</code> にあります。';
    note.classList.add('login-note-warn');
    return;
  }

  btn.addEventListener('click', async () => {
    btn.classList.add('hidden');
    busy.classList.remove('hidden');
    document.getElementById('loginBusyText').textContent = 'Xへ移動します...';
    try {
      await Auth.startLogin();
    } catch (e) {
      busy.classList.add('hidden');
      btn.classList.remove('hidden');
      UI.toast('ログインを開始できませんでした: ' + e.message, 'error');
    }
  });
})();
</script>
</body>
</html>
